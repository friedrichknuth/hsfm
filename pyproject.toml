[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsfm"
version = "0.1.0"
description = "Functions to process historical images into Digital Elevation Models."
authors = [
    {name = "Friedrich Knuth", email = "fknuth@ethz.ch"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Main conda dependencies are specified in environment.yml
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
]

# Git-based dependencies
git = [
    "pygeotools @ git+https://github.com/dshean/pygeotools.git",
    "demcoreg @ git+https://github.com/friedrichknuth/demcoreg.git",
    "imview @ git+https://github.com/dshean/imview.git",
    "bare @ git+https://github.com/friedrichknuth/bare.git",
    "hipp @ git+https://github.com/friedrichknuth/hipp.git",
]

[tool.setuptools]
packages = ["hsfm"]

[tool.setuptools.package-data]
hsfm = ["**/*"]
